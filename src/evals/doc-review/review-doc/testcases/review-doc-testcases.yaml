- description: "RD-TC01: /review-doc on vague PRD missing NFR & Edge Cases"
  vars:
    prompt: file://src/evals/doc-review/review-doc/prompts/review-doc-prompt.txt
    document_content: file://src/evals/doc-review/review-doc/fixtures/review-doc-poor-prd.md
  assert:
    - type: icontains
      value: "quality score"
      metric: ScoreProvided
    - type: icontains
      value: "relatively fast"
      metric: AmbiguityDetected
    - type: icontains
      value: "very quickly"
      metric: AmbiguityDetected
    - type: llm-rubric
      value: "Identifies ambiguous phrases 'relatively fast' and 'very quickly', highlights missing Non-Functional Requirements (NFR) and Edge cases, and provides a refactored draft."
      metric: ComprehensiveReview

- description: "RD-TC02: /review-doc on Technical Architecture Spec missing Database Schema & Security"
  vars:
    prompt: file://src/evals/doc-review/review-doc/prompts/review-doc-prompt.txt
    document_content: file://src/evals/doc-review/review-doc/fixtures/review-doc-arch-spec.md
  assert:
    - type: icontains
      value: "database"
      metric: SchemaGapDetected
    - type: icontains
      value: "security"
      metric: SecurityGapDetected
    - type: llm-rubric
      value: "Highlights gaps in architecture spec: missing Mermaid diagram, missing database schemas, missing security controls, and informal incident recovery procedure."
      metric: ArchitectureAudit

- description: "RD-TC03: /review-doc on High Quality README (High Quality Score)"
  vars:
    prompt: file://src/evals/doc-review/review-doc/prompts/review-doc-prompt.txt
    document_content: file://src/evals/doc-review/review-doc/fixtures/review-doc-high-quality-readme.md
  assert:
    - type: icontains
      value: "quality score"
      metric: ScoreProvided
    - type: javascript
      value: "output.includes('8') || output.includes('9') || output.includes('excellent') || output.includes('high quality') || output.includes('well-structured')"
      metric: HighScoreOrPraise
    - type: llm-rubric
      value: "Recognizes high-standard documentation, evaluates Quality Score >= 80/100, and commends benchmarks, code samples, and clear structure."
      metric: PositiveEvaluation
